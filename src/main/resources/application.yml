spring:
  application:
    name: url-shortener

  datasource:
    url: jdbc:postgresql://127.0.0.1:5432/urlshortener
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  data:
    redis:
      host: 127.0.0.1
      port: 6379

  flyway:
    enabled: true
    url: jdbc:postgresql://127.0.0.1:5432/urlshortener
    user: postgres
    password: postgres
    locations: classpath:db/migration

server:
  port: 8080

app:
  jwt:
    secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    expiration: 86400000